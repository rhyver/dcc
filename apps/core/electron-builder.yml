appId: at.digitalcrewchief.app
productName: DCC
directories:
  app: apps/core
  buildResources: build
electronDist: node_modules/electron/dist
files:
  # Explicit include set to avoid traversing workspace symlinks by default
  - out/**
  - resources/**
  - package.json
  # Exclude workspace-linked packages that are bundled by electron-vite
  - '!**/node_modules/@dcc/**'
  # General exclusions
  - '!**/.vscode/*'
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/.turbo/**'
asarUnpack:
  - resources/**
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
extraResources:
  - from: apps/frontend/dist
    to: renderer/frontend
  - from: apps/document/dist
    to: renderer/document
  - from: apps/frontend/public/maps/caucasus/caucasus.pmtiles
    to: maps/caucasus/caucasus.pmtiles
  - from: apps/frontend/public/maps/persian-gulf/persian-gulf.pmtiles
    to: maps/persian-gulf/persian-gulf.pmtiles
  - from: apps/frontend/public/maps/syria/syria.pmtiles
    to: maps/syria/syria.pmtiles
  - from: apps/frontend/public/maps/south-atlantic/south-atlantic.pmtiles
    to: maps/south-atlantic/south-atlantic.pmtiles
win:
  executableName: dcc
  target:
    - nsis
nsis:
  artifactName: dcc-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: dcc-${version}.${ext}
linux:
  executableName: dcc
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: dcc-${version}.${ext}
deb:
  artifactName: dcc-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://codeberg.org/rhyver/dcc/releases/download/dcc-latest
  channel: latest
